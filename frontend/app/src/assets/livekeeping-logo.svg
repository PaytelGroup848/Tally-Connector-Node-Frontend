<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LiveKeeping logo icon">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76D43A"/>
      <stop offset="55%" stop-color="#2DBB3C"/>
      <stop offset="100%" stop-color="#159A35"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".18"/>
    </filter>
    <clipPath id="round">
      <rect x="24" y="24" width="464" height="464" rx="72"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="24" y="24" width="464" height="464" rx="72" fill="url(#green)"/>

    <g clip-path="url(#round)">
      <!-- white rising bars -->
      <rect x="95" y="238" width="60" height="202" rx="26" fill="#fff"/>
      <rect x="203" y="165" width="60" height="275" rx="26" fill="#fff"/>
      <rect x="311" y="88" width="60" height="352" rx="26" fill="#fff"/>

      <!-- curved black lower-right sweep -->
      <path d="M24 441
               C123 386 193 331 267 268
               C341 206 412 139 488 42
               L488 488 L24 488 Z"
            fill="url(#black)"/>
    </g>
  </g>
</svg>
